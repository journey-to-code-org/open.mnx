[package]
name = "axum-garden"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false
description = "Community garden plots: Axum, with zubra components compiled into the binary. No Node.js, no child process."

# Its own workspace: the example builds on its own, as a user's project would.
[workspace]

[dependencies]
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
zubra = { path = "../../.." }
zubra-macros = { path = "../../../macros" }

[dev-dependencies]
ureq = "3"
