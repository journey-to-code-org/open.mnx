<h1>Harvest</h1>
{% if logged %}<p class="notice" role="status">Logged.</p>{% endif %}
<div class="split">
  <section>
    {{ mnx('harvest-chart', rows=bars, total=total, heading='This season') }}
  </section>
  <section>
    <h2>Log a harvest</h2>
    <form method="post" class="form">
      <label>Plot
        <select name="plot">
          {% for id in plots %}<option {% if id == chosen_plot %}selected{% endif %}>{{ id }}</option>{% endfor %}
        </select>
      </label>
      <label>Crop
        <select name="crop">
          {% for value, label in crops %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
        </select>
      </label>
      {{ mnx('number-field', name='kg', value=1, min=0.5, max=100, step=0.5, label='Weight', unit='kg') }}
      <button>Log harvest</button>
    </form>
  </section>
</div>
