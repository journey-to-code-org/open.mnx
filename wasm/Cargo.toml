[package]
name = "zubra-wasm"
version = "2.0.0"
edition = "2021"
rust-version = "1.97"
license = "ISC"
repository = "https://github.com/journey-to-code-org/zubra"
description = "The Zubra compiler as a WebAssembly module (one JSON request in, one JSON response out)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zubra = { path = ".." }
