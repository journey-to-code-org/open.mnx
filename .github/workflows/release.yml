# Releases a version when it reaches main: when the version in runtime/package.json (set by
# scripts/bump-version.sh in the release PR) has no GitHub release yet, this tags the commit, publishes
# the eight npm packages with provenance (scripts/publish.mjs), publishes the VS Code extension, and
# makes the GitHub release, with the version's CHANGELOG.md section as its notes and the .vsix attached.
#
# The order is so a failure leaves nothing half-public: the tag comes first, because it's the step a
# token can be refused (5.8.0 published to npm, then got a 403 creating its release, and every later
# run stopped at "already tagged"). Each step after it is skipped when already done, and a version
# counts as released only once its GitHub release exists, so re-running the job finishes whatever is
# missing. release-check.yml makes and removes a throwaway tag on each release PR, so a refused token
# shows up before the merge. A second
# job then builds the `zubra` CLI for Linux (glibc and musl, x64 and arm64), macOS (x64, arm64) and
# Windows (x64) and attaches the archives with a SHA256SUMS file, so servers written in anything
# can run `zubra serve` without Node or Rust.
#
# Pushes that don't change the version do nothing. It can be run again from the Actions tab: npm
# packages already published are skipped, and the release step only runs while the tag is missing.
# Everything is built from, and tagged on, the commit that set the version, not the commit that
# triggered the run: when a release fails partway and a later push finishes it, the packages, the
# .vsix and the tag still all come from the release itself.
#
# Tokens: npm and the VS Code Marketplace both trust this workflow (OIDC), set up once, so neither
# needs one. GitHub's own tag and release use the RELEASE_TOKEN secret when there is one (a
# fine-grained token for this repository with Contents and Workflows read and write), and the
# workflow's own token otherwise.
# - npm, per package on npmjs.com: Settings → Trusted publishing → GitHub Actions, organization
#   `journey-to-code-org`, repository `zubra`, workflow `release.yml`, no environment; allowed
#   actions: `npm publish` (not dist-tag). An NPM_TOKEN secret is used instead if there is one.
#   A new package can't be set up until it exists: publish its first version by hand, then add it.
# - The Marketplace, on the JourneytoCode publisher: Trusted Publishing, the same repository and
#   workflow.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, and never cancelled halfway through a publish.
concurrency:
  group: release
  cancel-in-progress: false

# Nothing by default: each job asks for what it does. The jobs that build the binaries run
# cargo and third-party toolchains, and must not hold the token that can publish or write releases.
permissions: {}

jobs:
  release:
    name: Publish and release
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the release
      id-token: write # trusted publishing (npm and the Marketplace) and npm's provenance
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to find the commit that set the version
      - name: Is this a new version?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./runtime/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Released means the GitHub release exists: a tag alone is a release that stopped partway.
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is released: nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
          # The commit that set the version: walking back along main (first parents) through the
          # commits that changed runtime/package.json, the oldest one still at this version.
          release=
          for sha in $(git log --first-parent --format=%H -- runtime/package.json); do
            [ "$(git show "$sha:runtime/package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")" = "$version" ] || break
            release=$sha
          done
          echo "Releasing $version from ${release:?no commit on main has version $version}."
          echo "sha=$release" >> "$GITHUB_OUTPUT"
      - name: Build from the release commit
        if: steps.version.outputs.new == 'true'
        run: git checkout --quiet "${{ steps.version.outputs.sha }}"
      # Before publishing anything: a release can't go out without its notes.
      - name: Release notes
        if: steps.version.outputs.new == 'true'
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"
      # Still before publishing anything: the tag, the step a token can be refused. A tag already on
      # the release commit (a re-run) is fine; one on another commit stops the release.
      - name: Tag the release commit
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          tagged=$(gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" --jq .object.sha 2> /dev/null || true)
          if [ -z "$tagged" ]; then
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$SHA" > /dev/null
            echo "Tagged $SHA as v$VERSION."
          elif [ "$tagged" = "$SHA" ]; then
            echo "v$VERSION is already on the release commit."
          else
            echo "::error::v$VERSION points at $tagged, not the release commit $SHA. Delete the tag, or release another version."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.version.outputs.new == 'true'
        with:
          toolchain: "1.97"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.new == 'true'
      # No registry-url: setup-node would then set NODE_AUTH_TOKEN, which overrides trusted publishing.
      - uses: actions/setup-node@v4
        if: steps.version.outputs.new == 'true'
        with:
          node-version: 22
      # Trusted publishing needs npm 11.5.1 or later; Node 22 comes with npm 10.
      - run: npm install -g npm@11
        if: steps.version.outputs.new == 'true'
      - name: Use an npm token, if there is one
        if: steps.version.outputs.new == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > "$HOME/.npmrc"
          fi
      - name: Publish to npm
        if: steps.version.outputs.new == 'true'
        run: node scripts/publish.mjs
      # The extension installs the language server just published, and npm can take minutes to serve
      # a version it has accepted (5.4.0's packaging gave up after two and a half): wait until it
      # does, up to ten minutes, asking the registry rather than npm's cache.
      - name: Wait for npm to serve the language server
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 40); do
            [ "$(npm view "@zubra/language-server@$VERSION" version --prefer-online 2> /dev/null)" = "$VERSION" ] && exit 0
            sleep 15
          done
          echo "::error::npm doesn't serve @zubra/language-server@$VERSION after ten minutes; re-run the failed job to finish the release (published packages are skipped)"
          exit 1
      - name: Package the VS Code extension
        if: steps.version.outputs.new == 'true'
        env:
          npm_config_prefer_online: "true"
        run: for attempt in 1 2 3; do npm run package && exit 0; sleep 30; done; exit 1
        working-directory: editors/vscode
      # The Marketplace's trusted publishing (OIDC, like npm's): a policy on the JourneytoCode
      # publisher names this repository and release.yml, so there's no token to store. Before the
      # GitHub release, so a release that exists is a release that's complete; skipped when the
      # Marketplace already has the version (a re-run).
      - name: Publish the extension to the Marketplace
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: editors/vscode
        run: |
          if npx --yes @vscode/vsce show JourneytoCode.zubra --json 2> /dev/null \
              | node -e "const e = JSON.parse(require('fs').readFileSync(0, 'utf8')); process.exit(e.versions?.some((v) => v.version === process.env.VERSION) ? 0 : 1)"; then
            echo "The Marketplace already has $VERSION."
          else
            npx --yes @vscode/vsce publish --oidc --packagePath "zubra-$VERSION.vsix"
          fi
      - name: Make the GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "editors/vscode/zubra-$VERSION.vsix" --verify-tag \
            --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest

  # Prebuilt CLI binaries for the release just made, or for a release that is missing them (this
  # job runs on every push to main, and does nothing once the release has a SHA256SUMS file).
  binaries-needed:
    name: Binaries needed?
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if ! gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION has no release yet: nothing to attach binaries to."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif ! gh api "repos/$GH_REPO/contents/scripts/package-binary.sh?ref=v$VERSION" > /dev/null 2>&1; then
            # The binaries are built from the tag, with the tag's own packaging script. A release
            # from before that script existed has nothing to build them with, and would fail this
            # job on every push to main until the next release.
            echo "v$VERSION was tagged before binaries were built: none for it."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS; then
            echo "v$VERSION already has its binaries."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  binaries:
    name: Binary (${{ matrix.target }})
    needs: [release, binaries-needed]
    if: needs.binaries-needed.outputs.needed == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest runners, so the glibc binaries run on older distributions.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          # Static, for Alpine and for containers with no libc to match.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04-arm, musl: true }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      # The tag, not the commit that triggered the run: the binaries are the release's.
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: ${{ matrix.target }}
      - name: musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --bin zubra --target ${{ matrix.target }}
      - name: Run what was built
        run: |
          exe=target/${{ matrix.target }}/release/zubra
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" fmt --stdin <<< '<hello-x></hello-x>' | grep -q 'hello-x'
      # The archive's path from the workspace, not the absolute one the script prints: on Windows
      # that is a Git Bash path (/d/a/…), which the upload step (not a shell) can't open.
      - id: pack
        run: |
          archive="$(scripts/package-binary.sh ${{ matrix.target }} ${{ needs.release.outputs.version }})"
          echo "archive=dist/$(basename "$archive")" >> "$GITHUB_OUTPUT"
          ls -l "dist/$(basename "$archive")"
      - uses: actions/upload-artifact@v4
        with:
          name: zubra-${{ matrix.target }}
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error

  attach-binaries:
    name: Attach the binaries to the release
    needs: [release, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploading to the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zubra-*
          path: dist
          merge-multiple: true
      - name: Checksums, then attach (the checksums go last, as they mark the release complete)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd dist
          ls -l
          [ "$(ls | wc -l)" -eq 7 ] || { echo "::error::expected 7 archives"; exit 1; }
          sha256sum * > SHA256SUMS
          gh release upload "v$VERSION" --clobber $(ls | grep -v '^SHA256SUMS$')
          gh release upload "v$VERSION" --clobber SHA256SUMS
