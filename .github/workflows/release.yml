# Releases a version when it reaches main: when the version in runtime/package.json (set by
# scripts/bump-version.sh in the release PR) has no tag yet, this publishes the eight npm packages
# with provenance (scripts/publish.mjs), then tags the commit and makes the GitHub release, with the
# version's CHANGELOG.md section as its notes and the VS Code extension's .vsix attached.
#
# Pushes that don't change the version do nothing. It can be run again from the Actions tab: npm
# packages already published are skipped, and the release step only runs while the tag is missing.
# Everything is built from, and tagged on, the commit that set the version, not the commit that
# triggered the run: when a release fails partway and a later push finishes it, the packages, the
# .vsix and the tag still all come from the release itself.
#
# No tokens: npm and the VS Code Marketplace both trust this workflow (OIDC), set up once.
# - npm, per package on npmjs.com: Settings → Trusted publishing → GitHub Actions, organization
#   `journey-to-code-org`, repository `zubra`, workflow `release.yml`, no environment; allowed
#   actions: `npm publish` (not dist-tag). An NPM_TOKEN secret is used instead if there is one.
#   A new package can't be set up until it exists: publish its first version by hand, then add it.
# - The Marketplace, on the JourneytoCode publisher: Trusted Publishing, the same repository and
#   workflow.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, and never cancelled halfway through a publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # the tag and the release
  id-token: write # trusted publishing (npm and the Marketplace) and npm's provenance

jobs:
  release:
    name: Publish and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to find the commit that set the version
      - name: Is this a new version?
        id: version
        run: |
          version=$(node -p "require('./runtime/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged: nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
          # The commit that set the version: walking back along main (first parents) through the
          # commits that changed runtime/package.json, the oldest one still at this version.
          release=
          for sha in $(git log --first-parent --format=%H -- runtime/package.json); do
            [ "$(git show "$sha:runtime/package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")" = "$version" ] || break
            release=$sha
          done
          echo "Releasing $version from ${release:?no commit on main has version $version}."
          echo "sha=$release" >> "$GITHUB_OUTPUT"
      - name: Build from the release commit
        if: steps.version.outputs.new == 'true'
        run: git checkout --quiet "${{ steps.version.outputs.sha }}"
      # Before publishing anything: a release can't go out without its notes.
      - name: Release notes
        if: steps.version.outputs.new == 'true'
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"
      - uses: dtolnay/rust-toolchain@master
        if: steps.version.outputs.new == 'true'
        with:
          toolchain: "1.97"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.new == 'true'
      # No registry-url: setup-node would then set NODE_AUTH_TOKEN, which overrides trusted publishing.
      - uses: actions/setup-node@v4
        if: steps.version.outputs.new == 'true'
        with:
          node-version: 22
      # Trusted publishing needs npm 11.5.1 or later; Node 22 comes with npm 10.
      - run: npm install -g npm@11
        if: steps.version.outputs.new == 'true'
      - name: Use an npm token, if there is one
        if: steps.version.outputs.new == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > "$HOME/.npmrc"
          fi
      - name: Publish to npm
        if: steps.version.outputs.new == 'true'
        run: node scripts/publish.mjs
      - name: Package the VS Code extension
        if: steps.version.outputs.new == 'true'
        # It installs the language server just published; npm can take a minute to serve it.
        run: for attempt in 1 2 3 4 5; do npm run package && exit 0; sleep 30; done; exit 1
        working-directory: editors/vscode
      - name: Tag and release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          gh release create "v$VERSION" "editors/vscode/zubra-$VERSION.vsix" \
            --target "$SHA" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
      # The Marketplace's trusted publishing (OIDC, like npm's): a policy on the JourneytoCode
      # publisher names this repository and release.yml, so there's no token to store.
      - name: Publish the extension to the Marketplace
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce publish --oidc --packagePath "zubra-$VERSION.vsix"
