name: Release check

# On a release PR (one that changes the version in runtime/package.json), checks what release.yml
# will need once it's merged, so a problem shows up before anything is published:
# - the version's CHANGELOG.md section exists, for the release notes;
# - the token release.yml tags with (RELEASE_TOKEN, or the workflow's own) can make a tag here: this
#   makes a throwaway tag on the PR's head commit and removes it. 5.8.0 found that out only after
#   its npm packages were public.
#
# Two jobs, so the PR's own code never runs beside a token that can write: `notes` checks out and
# runs the PR (scripts/release-notes.mjs) with a read-only token and no stored credentials; `tag`
# holds the write token and checks out nothing.

on:
  pull_request:
    branches: [main]
    paths: [runtime/package.json]

permissions: {}

jobs:
  notes:
    name: The release has notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Is the version changing?
        id: version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          version=$(node -p "require('./runtime/package.json').version")
          before=$(git show "$BASE:runtime/package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          # The version comes from the PR: it is only ever passed on through env, never into a script.
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "$before" ]; then
            echo "The version stays $version: not a release PR."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "A release PR: $before → $version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-notes.mjs "$VERSION" > /dev/null

  tag:
    name: The release can be tagged
    needs: notes
    if: needs.notes.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the throwaway tag
    steps:
      - name: Make and remove a throwaway tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          TAG: release-check-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if ! gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" > /dev/null; then
            echo "::error::This token can't make a tag here, so release.yml would fail after this merges. Add a RELEASE_TOKEN secret: a fine-grained token for this repository with Contents and Workflows read and write."
            exit 1
          fi
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG"
          echo "Tagging works; the throwaway tag is gone."
