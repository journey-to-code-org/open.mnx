name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compiler:
    name: Compiler (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  runtime:
    name: Runtime (unit, browser, tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
        working-directory: runtime
      - run: npx playwright install --with-deps chromium
        working-directory: runtime
      - run: npm test
        working-directory: runtime
      - run: npm run test:browser
        working-directory: runtime
      - run: npm run test:tools
        working-directory: runtime
      # The component registry: keyboard and screen-reader behaviour of each component, and its index.
      - run: node --test "registry/test/*.test.js"
      - run: node registry/build-index.mjs --check

  plugin:
    name: Build plugin (Vite, React, Vue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
        working-directory: runtime
      - run: npm ci
        working-directory: plugin
      - run: npx playwright install --with-deps chromium
        working-directory: plugin
      - run: npm test
        working-directory: plugin

  frameworks:
    name: Framework examples (React, Vue, Svelte, Solid, Lit, Preact, Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugin/package-lock.json
            examples/frameworks/package-lock.json
      - run: npm ci
        working-directory: runtime
      - run: npm ci
        working-directory: plugin
      - run: npm ci
        working-directory: examples/frameworks
      - run: npx playwright install --with-deps chromium
        working-directory: examples/frameworks
      - run: npm test
        working-directory: examples/frameworks
      # npm create mnx: its command line (the apps it writes ran in the step above).
      - run: npm test
        working-directory: create
      # The playground, compiling through the native CLI, with React and Vue previews.
      - run: node --test "playground/test/*.test.js"
      # The first ten minutes, scripted: npm create mnx → mnx add → test → mnx build --lib → pack.
      - run: node scripts/adoption-check.mjs --budget-minutes 10

  helpdesk:
    name: Server example (Express, EJS, MongoDB)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/helpdesk/package-lock.json
      - run: cargo build --locked
      - run: npm ci
        working-directory: runtime
      - run: npm ci
        working-directory: examples/helpdesk
      - run: npx playwright install --with-deps chromium
        working-directory: examples/helpdesk
      # The in-memory store, then everything again on MongoDB.
      - run: npm test
        working-directory: examples/helpdesk
      - run: npm test
        working-directory: examples/helpdesk
        env:
          MONGODB_URI: mongodb://localhost:27017

  meta:
    name: Meta-framework examples (Next.js, Nuxt, SvelteKit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [next-conference, nuxt-bookshop, sveltekit-workouts]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/meta/${{ matrix.app }}/package-lock.json
      - run: cargo build --locked
      - run: npm ci
        working-directory: examples/meta/${{ matrix.app }}
      - run: npx playwright install --with-deps chromium
        working-directory: examples/meta/${{ matrix.app }}
      - run: npm test
        working-directory: examples/meta/${{ matrix.app }}

  backends:
    name: Non-JS backend examples (Flask)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: examples/backends/flask-garden/requirements-test.txt
      # The server side is Python and the mnx CLI only: no Node.js.
      - run: cargo build --locked
      - run: pip install -r requirements-test.txt
        working-directory: examples/backends/flask-garden
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
        working-directory: examples/backends/flask-garden

  wasm:
    name: WebAssembly compiler
    runs-on: ubuntu-latest
    env:
      MNX_REQUIRE_WASM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --locked
      - run: npm run build
        working-directory: compiler
      - run: ls -l mnx.wasm
        working-directory: compiler
      # The built compiler, for running the examples without Rust: put it in compiler/.
      - uses: actions/upload-artifact@v4
        with:
          name: mnx-wasm
          path: compiler/mnx.wasm
          retention-days: 30
          overwrite: true
      - run: npm test
        working-directory: compiler
      - run: npm ci
        working-directory: runtime
      - run: npm ci
        working-directory: plugin
      - run: npx playwright install --with-deps chromium
        working-directory: plugin
      - run: node --test --test-name-pattern "WebAssembly" test/plugin.test.js
        working-directory: plugin
      # The playground compiling with mnx.wasm in the page.
      - run: node --test "playground/test/*.test.js"

  editors:
    name: Editor support (language server, VS Code grammar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --locked
      - run: npm ci
        working-directory: editors/language-server
      - run: npm test
        working-directory: editors/language-server
      - run: npm ci
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
