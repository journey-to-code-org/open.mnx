name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compiler:
    name: Compiler (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The release's binary archives (.github/workflows/release.yml).
      - run: scripts/package-binary.test.sh
      # The weekly canary's choice of framework versions (.github/workflows/canary.yml).
      - run: node --test scripts/canary.test.js
      # The repository's own components are laid out by zubra fmt.
      - run: cargo run --locked -- fmt --check .

  runtime:
    name: Runtime (unit, browser, tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
        working-directory: runtime
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
        working-directory: runtime
      - run: npm test
        working-directory: runtime
      # Explicit Resource Management (`using`, DisposableStack) is in Node 24, not 22: the disposal
      # tests that need it are skipped above and run here.
      - run: npx -y node@24 --test --test-reporter=spec test/effect.test.js test/resource.test.js
        working-directory: runtime
      - run: npm run test:browser
        working-directory: runtime
      # The same suite on the production build (no hot reloading).
      - run: npm run test:browser
        working-directory: runtime
        env:
          ZUBRA_RUNTIME: production
      # The same suite on --emit element output: plain custom elements with no runtime. Tests of
      # what only the runtime does (server hydration, hot reload) are skipped, and a component
      # --emit element refuses is built with --emit js.
      - run: npm run test:browser
        working-directory: runtime
        env:
          ZUBRA_EMIT: element
      - run: npm run test:tools
        working-directory: runtime
      # The component registry: keyboard and screen-reader behaviour of each component, and its index.
      - run: node --test "registry/test/*.test.js"
      # The registry again, as plain elements.
      - run: node --test "registry/test/*.test.js"
        env:
          ZUBRA_EMIT: element
      - run: node registry/build-index.mjs --check

  engines:
    name: Runtime and React/Vue apps in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      ZUBRA_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            runtime/package-lock.json
            plugin/package-lock.json
            examples/frameworks/package-lock.json
      - run: npm ci
        working-directory: runtime
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" ${{ matrix.browser }}
        working-directory: runtime
      - run: npm run test:browser
        working-directory: runtime
      # The registry's widgets (3.6) lean on newer platform features (popover, anchor positioning,
      # <details name>), so they run in every engine.
      - run: node --test "registry/test/*.test.js"
      - run: npm ci
        working-directory: plugin
      - run: npm ci
        working-directory: examples/frameworks
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" ${{ matrix.browser }}
        working-directory: examples/frameworks
      - run: node test/build-ui.mjs && node --test test/react.test.js test/vue.test.js
        working-directory: examples/frameworks

  plugin:
    name: Build plugin (Vite, React, Vue), @zubra/server and @zubra/actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
        working-directory: runtime
      - run: npm ci
        working-directory: plugin
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
        working-directory: plugin
      - run: npm test
        working-directory: plugin
      # @zubra/server (Express, Fastify, Hono, injectShadowRoots) and the compiler's checks of
      # server-side evaluation against V8.
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      # @zubra/actions ('use server' functions: the contract, the adapters, and the same form
      # with and without JavaScript in Chromium).
      - run: npm ci
        working-directory: actions
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
        working-directory: actions
      - run: npm test
        working-directory: actions
      # @zubra/sync ('use collection': reloads, documents, elements and tabs, in Chromium).
      - run: npm ci
        working-directory: sync
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
        working-directory: sync
      # The same tests against the zubra-sync binary (protocol tests pick it up when it's built;
      # test:binary puts it behind the browser tests' server).
      - run: cargo build --locked -p zubra-sync
      - run: npm test
        working-directory: sync
      - run: npm run test:binary
        working-directory: sync
      - run: npm ci
        working-directory: compiler
      - run: node --test test/server-evaluation.test.js
        working-directory: compiler

  demos:
    name: Demo gallery (every static example under a base path, as GitHub Pages serves it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The WebAssembly compiler, as the Pages deploy uses (the CLI hides problems with loading
      # zubra.wasm, such as a bundler moving @zubra/compiler away from it).
      - run: npm run build
        working-directory: compiler
      - run: npm ci
        working-directory: runtime
      - run: npm ci
        working-directory: plugin
      - run: npm ci
        working-directory: site
      - run: npm ci
        working-directory: examples/frameworks
      - name: Install the other static examples
        run: for app in todo planner recipes meta/eleventy-trails; do (cd "examples/$app" && npm ci); done
      - run: node demos/build.mjs --require-wasm --out _site --base /zubra/
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
        working-directory: examples/frameworks
      - run: node --test "demos/test/*.test.js"
        env:
          GALLERY: _site
          GALLERY_BASE: /zubra/

  frameworks:
    name: Framework examples (React, Vue, Svelte, Solid, Lit, Preact, Angular, FAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugin/package-lock.json
            examples/frameworks/package-lock.json
      - run: npm ci
        working-directory: runtime
      - run: npm ci
        working-directory: plugin
      - run: npm ci
        working-directory: examples/frameworks
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
        working-directory: examples/frameworks
      - run: npm test
        working-directory: examples/frameworks
      # npm create zubra: its command line (the apps it writes ran in the step above).
      - run: npm test
        working-directory: create
      # The playground, compiling through the native CLI, with React and Vue previews.
      - run: node --test "playground/test/*.test.js"
      # The first ten minutes, scripted: npm create zubra → zubra add → test → zubra build --lib → pack.
      - run: node scripts/adoption-check.mjs --budget-minutes 10

  helpdesk:
    name: Server example (Express, EJS, MongoDB)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/helpdesk/package-lock.json
      - run: cargo build --locked
      - run: npm ci
        working-directory: runtime
      - run: npm ci
        working-directory: examples/helpdesk
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
        working-directory: examples/helpdesk
      # The in-memory store, then everything again on MongoDB.
      - run: npm test
        working-directory: examples/helpdesk
      - run: npm test
        working-directory: examples/helpdesk
        env:
          MONGODB_URI: mongodb://localhost:27017

  meta:
    name: Meta-framework examples (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [next-conference, nuxt-bookshop, sveltekit-workouts, react-router-trips, solidstart-potluck, eleventy-trails]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/meta/${{ matrix.app }}/package-lock.json
      - run: cargo build --locked
      - run: npm ci
        working-directory: examples/meta/${{ matrix.app }}
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
        working-directory: examples/meta/${{ matrix.app }}
      - run: npm test
        working-directory: examples/meta/${{ matrix.app }}

  backends:
    name: Non-JS backend examples (Flask)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: examples/backends/flask-garden/requirements-test.txt
      # The server side is Python and the zubra CLI only: no Node.js.
      - run: cargo build --locked
      - run: pip install -r requirements-test.txt
        working-directory: examples/backends/flask-garden
      - run: PLAYWRIGHT="python -m playwright" bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
      - run: python -m unittest discover -s tests -v
        working-directory: examples/backends/flask-garden
      # The same garden from Axum: the pages must be the Flask example's HTML. No Node.js, no child process.
      - name: Start the Flask garden
        working-directory: examples/backends/flask-garden
        run: |
          ZUBRA_COMPILER="$GITHUB_WORKSPACE/target/debug/zubra" python app.py > flask.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fs http://127.0.0.1:5000/ > /dev/null && exit 0; sleep 1; done
          cat flask.log; exit 1
      - run: cargo test --locked
        working-directory: examples/backends/axum-garden
        env:
          FLASK_GARDEN_URL: http://127.0.0.1:5000

  python-client:
    name: Python package (zubra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cargo build --locked
      - run: pip install jinja2 django
      # The package against the real compiler, then a wheel built and installed the way pip does.
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
        working-directory: clients/python
        env:
          ZUBRA_COMPILER: ${{ github.workspace }}/target/debug/zubra

  server-clients:
    name: Ruby and PHP packages (zubra gem, zubra/zubra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: cargo build --locked
      - run: ruby -Ilib -Itest test/test_zubra.rb
        working-directory: clients/ruby
        env:
          ZUBRA_COMPILER: ${{ github.workspace }}/target/debug/zubra
      - run: php tests/run.php
        working-directory: clients/php
        env:
          ZUBRA_COMPILER: ${{ github.workspace }}/target/debug/zubra

  hypermedia:
    name: Hypermedia examples (Hono + htmx, on Node.js and Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/hypermedia/hono-bikes/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: cargo build --locked
      - run: npm ci
        working-directory: examples/hypermedia/hono-bikes
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
        working-directory: examples/hypermedia/hono-bikes
      # The tests run the server on Node.js and on Bun.
      - run: npm test
        working-directory: examples/hypermedia/hono-bikes

  edge-worker:
    name: Hono bike shop on a Cloudflare Worker (workerd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --locked
      # The Worker runs the compiler's WebAssembly build.
      - run: npm run build
        working-directory: compiler
      - run: npm ci
        working-directory: examples/hypermedia/hono-bikes
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm install
        working-directory: examples/edge/hono-bikes-worker
      # Runs the Worker in workerd and compares its HTML to the Node.js app's.
      - run: npm test
        working-directory: examples/edge/hono-bikes-worker

  edge-sync-actions:
    name: Sync and Actions on a Cloudflare Worker (standup, workerd + Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --locked
      # The Worker runs the compiler's WebAssembly build.
      - run: npm run build
        working-directory: compiler
      # The example links @zubra/actions and @zubra/server from the repository, so their imports
      # resolve from their own folders: the build script compiles the server functions with them.
      - run: npm ci
        working-directory: server
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm ci
        working-directory: actions
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm install
        working-directory: examples/edge/standup-worker
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
        working-directory: examples/edge/standup-worker
      # The board in workerd with two browsers, and the log contract on a Durable Object's storage.
      - run: npm test
        working-directory: examples/edge/standup-worker

  standup:
    name: Local-first example (standup, @zubra/sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/standup/package-lock.json
      - run: cargo build --locked
      - run: npm ci
        working-directory: examples/standup
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
        working-directory: examples/standup
      - run: npm test
        working-directory: examples/standup

  clients:
    name: Extension and desktop examples (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [extension/page-notes, desktop/focus-timer]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/${{ matrix.app }}/package-lock.json
      - run: cargo build --locked
      # Electron's binary comes from GitHub releases, which sometimes answer 504: cache it, and
      # retry the download, rather than fail the job.
      - if: matrix.app == 'desktop/focus-timer'
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ hashFiles('examples/desktop/focus-timer/package-lock.json') }}
      - run: npm ci
        working-directory: examples/${{ matrix.app }}
      - if: matrix.app == 'desktop/focus-timer'
        name: Make sure Electron's binary is installed (retrying the download)
        working-directory: examples/${{ matrix.app }}
        run: |
          for attempt in 1 2 3 4; do
            node -e "require('electron')" 2>/dev/null && [ -e "$(node -p "require('electron')")" ] && exit 0
            echo "Electron's binary is missing (attempt $attempt): downloading it again"
            node node_modules/electron/install.js || sleep $((attempt * 15))
          done
          [ -e "$(node -p "require('electron')")" ]
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
        working-directory: examples/${{ matrix.app }}
      # (Electron needs a display; the extension test is headless either way.)
      - run: xvfb-run -a npm test
        working-directory: examples/${{ matrix.app }}

  wasm:
    name: WebAssembly compiler
    runs-on: ubuntu-latest
    env:
      ZUBRA_REQUIRE_WASM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --locked
      - run: npm run build
        working-directory: compiler
      - run: ls -l zubra.wasm
        working-directory: compiler
      # The built compiler, for running the examples without Rust: put it in compiler/.
      - uses: actions/upload-artifact@v4
        with:
          name: zubra-wasm
          path: compiler/zubra.wasm
          retention-days: 30
          overwrite: true
      # (Its test-only dependencies: LiquidJS for the embed build's Shopify blocks.)
      - run: npm ci
        working-directory: compiler
      - run: npm test
        working-directory: compiler
      - run: npm ci
        working-directory: runtime
      - run: npm ci
        working-directory: plugin
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
        working-directory: plugin
      - run: node --test --test-name-pattern "WebAssembly" test/plugin.test.js
        working-directory: plugin
      # Embed builds loaded in a browser (Playwright comes with runtime/).
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
        working-directory: runtime
      - run: node --test test/embed.test.js
        working-directory: compiler
      # A library's tests in Vitest browser mode, through plain HTML, React and Vue
      # (@zubra/runtime/testing).
      - run: npm ci
        working-directory: examples/testing-vitest
      - run: npm test
        working-directory: examples/testing-vitest
      # @zubra/server/edge against the Node entry. These tests skip without zubra.wasm, which the
      # job that runs the rest of the server's tests doesn't build; here they must run.
      - run: npm ci
        working-directory: server
      - run: node --test test/edge.test.js
        working-directory: server
      # The playground compiling with zubra.wasm in the page.
      - run: node --test "playground/test/*.test.js"

  editors:
    name: Editor support (language server, VS Code grammar, DevTools extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --locked
      - run: npm ci
        working-directory: editors/language-server
      - run: npm test
        working-directory: editors/language-server
      - run: npm ci
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
      # The DevTools extension: the manifest and the pane's rendering (the pane against a live page
      # runs with the runtime's browser suite).
      - run: npm test
        working-directory: editors/devtools
      # What addons.mozilla.org's validator checks, warnings included.
      - run: npx --yes web-ext lint --source-dir editors/devtools --self-hosted --warnings-as-errors

  benchmark:
    name: js-framework-benchmark (Zubra's implementation passes the benchmark's checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The implementation builds from the published packages, as it would in the benchmark's repository.
      - run: npm ci
        working-directory: benchmarks/js-framework-benchmark
      - run: npm run build
        working-directory: benchmarks/js-framework-benchmark
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
        working-directory: benchmarks/js-framework-benchmark
      - run: npm test
        working-directory: benchmarks/js-framework-benchmark

  prettier-plugin:
    name: Prettier plugin (prettier-plugin-zubra)
    runs-on: ubuntu-latest
    env:
      ZUBRA_REQUIRE_WASM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The plugin lays the template out with @zubra/compiler's WebAssembly build.
      - run: cargo build --locked
      - run: npm run build
        working-directory: compiler
      - run: npm ci
        working-directory: prettier-plugin
      - run: npm test
        working-directory: prettier-plugin

  compared:
    name: Compared with WebUI, FAST, Enhance and WebC (the measured components work)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/compared/html-first/package-lock.json
      - run: npm ci
        working-directory: runtime
      - run: npm ci
        working-directory: docs/compared/html-first
      - run: bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
        working-directory: docs/compared/html-first
      # Each tool's copy button works in Chromium, and the page's claims about what each server
      # evaluates still hold; then the measurements, for the job's log.
      - run: npm test
        working-directory: docs/compared/html-first
      - run: node measure.mjs --renders 1000
        working-directory: docs/compared/html-first


  skills:
    name: Skills (examples compile, copies in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release --locked
      - run: node --test skills/test/skills.test.js

  guide-pages:
    name: Guide pages (snippets match the example apps; every entry has a tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test docs/test/guide-pages.test.js
      # docs/stability.md has a tier for every published entry and command, and no stale rows.
      - run: node --test docs/test/stability.test.js

  skills-agent:
    # The skill in use: an agent writes a component from it alone (plan/roadmap-4.0.md, decision 4).
    # Non-blocking, and only where an API key is set, until it has been stable for three releases.
    name: Skills (an agent uses them; non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY is not set; skipping" && exit 0
      - if: env.ANTHROPIC_API_KEY != ''
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - if: env.ANTHROPIC_API_KEY != ''
        uses: Swatinem/rust-cache@v2
      - if: env.ANTHROPIC_API_KEY != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.ANTHROPIC_API_KEY != ''
        run: cargo build --release --locked
      - if: env.ANTHROPIC_API_KEY != ''
        run: npm ci && bash "$GITHUB_WORKSPACE/scripts/install-browsers.sh" chromium
        working-directory: runtime
      - if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code
      - if: env.ANTHROPIC_API_KEY != ''
        run: ZUBRA_AGENT="claude -p" node --test skills/test/agent.test.js
