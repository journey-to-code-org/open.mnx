# The playground on GitHub Pages: the WebAssembly compiler, the runtime, and React and Vue for
# the framework previews. It deploys once Pages is enabled (Settings → Pages → Source: GitHub
# Actions); until then the site is still built (and checked), and the deploy is skipped.
name: Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        name: Is GitHub Pages enabled?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Playground not deployed::GitHub Pages isn't enabled for this repository. Turn it on in Settings → Pages (Source: GitHub Actions) to publish the playground."
          fi
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
        working-directory: compiler
      - run: npm ci
        working-directory: examples/frameworks
      - run: node playground/build.mjs --require-wasm --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
