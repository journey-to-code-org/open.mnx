[package]
name = "mnix-compiler"
version = "0.3.0-dev"
edition = "2021"
rust-version = "1.97"
publish = false
description = "Build-time compiler for MNIX HTML-first components"

[[bin]]
name = "mnix"
path = "src/main.rs"

[dependencies]
html-escape = "0.2"
oxc_allocator = "0.157"
oxc_ast = "0.157"
oxc_ast_visit = "0.157"
oxc_parser = "0.157"
oxc_span = "0.157"
serde_json = { version = "1", features = ["preserve_order"] }

[workspace]
resolver = "2"
