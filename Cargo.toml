[package]
name = "mnx-compiler"
version = "2.6.0"
edition = "2021"
rust-version = "1.97"
license = "ISC"
repository = "https://github.com/journey-to-code-org/open.mnx"
description = "Compiler for mnx Web Components: HTML-first components to server-rendered HTML and hydrating custom elements"

[[bin]]
name = "mnx"
path = "src/main.rs"

# The 1.x name, kept as an alias through 2.x.
[[bin]]
name = "mnix"
path = "src/bin/mnix.rs"

[dependencies]
html-escape = "0.2"
oxc_allocator = "0.157"
oxc_ast = "0.157"
oxc_ast_visit = "0.157"
oxc_parser = "0.157"
oxc_semantic = "0.157"
oxc_span = "0.157"
oxc_syntax = "0.157"
serde_json = { version = "1", features = ["preserve_order"] }

[workspace]
members = [".", "wasm"]
resolver = "2"
