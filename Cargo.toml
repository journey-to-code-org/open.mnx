[package]
name = "zubra"
version = "5.3.0"
edition = "2021"
rust-version = "1.97"
license = "ISC"
repository = "https://github.com/journey-to-code-org/zubra"
description = "Compiler for Zubra web components: HTML-first components to server-rendered HTML and hydrating custom elements"
homepage = "https://github.com/journey-to-code-org/zubra"
readme = "README.md"
keywords = ["web-components", "compiler", "custom-elements", "ssr", "html"]
categories = ["compilers", "web-programming", "command-line-utilities"]
# The crate is the compiler; the runtime, plugins, examples and docs ship through npm.
include = ["/src/**/*", "/tests/**/*", "/Cargo.toml", "/README.md", "/LICENSE"]

[[bin]]
name = "zubra"
path = "src/main.rs"

[dependencies]
html-escape = "0.2"
oxc_allocator = "0.157"
oxc_ast = "0.157"
oxc_ast_visit = "0.157"
oxc_parser = "0.157"
oxc_semantic = "0.157"
oxc_span = "0.157"
oxc_syntax = "0.157"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[workspace]
members = [".", "wasm", "sync-server"]
resolver = "2"
